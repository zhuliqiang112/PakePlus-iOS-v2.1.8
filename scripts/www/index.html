<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辅料取样计算器</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 统一的 Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#3b82f6',
                        accent: '#60a5fa',
                        neutral: '#f3f4f6',
                        'neutral-dark': '#9ca3af'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'pulse-light': 'pulseLight 2s infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        pulseLight: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' }
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .input-shadow {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }
            .result-shadow {
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }
            .btn-shadow {
                box-shadow: 0 4px 0 0 theme('colors.primary.800');
            }
            .btn-shadow:active {
                transform: translateY(4px);
                box-shadow: 0 0 0 0 theme('colors.primary.800');
            }
            .history-item {
                transition: all 0.2s ease;
            }
            .history-item:hover {
                background-color: theme('colors.neutral.200');
            }
            .formula-highlight {
                @apply bg-blue-100 text-primary font-semibold px-1 rounded;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <!-- 应用标题 -->
        <header class="text-center mb-8 animate-fade-in">
            <div class="flex justify-center items-center mb-2">
                <i class="fa fa-calculator text-primary text-4xl mr-2"></i>
                <h1 class="text-3xl font-bold text-primary">辅料取样计算器</h1>
            </div>
            <p class="text-neutral-dark text-sm">快速计算取样数量，确保检测合规性</p>
        </header>

        <!-- 主要内容区 -->
        <main class="space-y-6">
            <!-- 输入区域 -->
            <section class="bg-white rounded-xl p-6 input-shadow animate-fade-in">
                <div class="mb-4">
                    <label for="inputValue" class="block text-sm font-medium text-gray-700 mb-1">
                        请输入来料总数量 （n，以最小单位计数）
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-hashtag"></i>
                        </span>
                        <input 
                            type="number" 
                            id="inputValue" 
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all"
                            placeholder="例如：150" 
                            step="0.01"
                            inputmode="decimal"
                        >
                    </div>
                </div>
                
                <button 
                    id="calculateBtn" 
                    class="w-full bg-primary text-white py-3 rounded-lg font-medium btn-shadow transition-all flex items-center justify-center"
                >
                    <i class="fa fa-calculator mr-2"></i>
                    开始计算
                </button>
            </section>

            <!-- 结果展示区域 -->
            <section id="resultSection" class="hidden bg-white rounded-xl p-6 result-shadow animate-slide-up">
                <div class="flex items-start justify-between mb-4">
                    <h2 class="text-lg font-semibold text-gray-800">计算结果</h2>
                    <span id="copyBtn" class="text-primary cursor-pointer hover:text-secondary transition-colors">
                        <i class="fa fa-copy"></i>
                    </span>
                </div>
                
                <div class="bg-blue-50 rounded-lg p-4 mb-4">
                    <div class="flex items-end justify-between">
                        <div>
                            <p class="text-sm text-gray-600">应取样数量</p>
                            <p class="text-3xl font-bold text-primary" id="resultValue">--</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-gray-500">计算依据</p>
                            <p class="text-sm font-medium text-gray-700" id="resultFormula">--</p>
                        </div>
                    </div>
                </div>
                
                <div class="text-sm text-gray-600">
                    <p id="resultExplanation">--</p>
                </div>
            </section>

            <!-- 计算规则说明 -->
            <section class="bg-white rounded-xl p-6 input-shadow animate-fade-in">
                <h2 class="text-lg font-semibold text-gray-800 mb-3">计算规则</h2>
                <ul class="space-y-2 text-sm text-gray-600">
                    <li class="flex items-start">
                        <span class="bg-blue-100 text-primary text-xs font-semibold px-2 py-1 rounded mr-2 mt-0.5">规则1</span>
                        <span>当 <span class="formula-highlight">n ≤ 3</span> 时，<span class="font-medium">逐件抽检</span></span>
                    </li>
                    <li class="flex items-start">
                        <span class="bg-blue-100 text-primary text-xs font-semibold px-2 py-1 rounded mr-2 mt-0.5">规则2</span>
                        <span>当 <span class="formula-highlight">3 < n ≤ 300</span> 时，按 <span class="formula-highlight">√n + 1</span> 抽检</span>
                    </li>
                    <li class="flex items-start">
                        <span class="bg-blue-100 text-primary text-xs font-semibold px-2 py-1 rounded mr-2 mt-0.5">规则3</span>
                        <span>当 <span class="formula-highlight">n > 300</span> 时，按 <span class="formula-highlight">(√n)/2 + 1</span> 抽检</span>
                    </li>
                </ul>
                <p class="mt-3 text-xs text-gray-500">注：若计算结果非整数，则进位成整数</p>
            </section>

            <!-- 历史记录区域 -->
            <section id="historySection" class="animate-fade-in">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-semibold text-gray-800">历史记录</h2>
                    <button id="clearHistoryBtn" class="text-xs text-neutral-dark hover:text-red-500 transition-colors">
                        <i class="fa fa-trash-o mr-1"></i>清除
                    </button>
                </div>
                
                <div id="historyList" class="bg-white rounded-xl input-shadow max-h-60 overflow-y-auto">
                    <!-- 历史记录将通过JavaScript动态添加 -->
                    <div class="text-center text-neutral-dark py-8 text-sm" id="emptyHistory">
                        <i class="fa fa-history text-2xl mb-2 block"></i>
                        暂无计算记录
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部信息 -->
        <footer class="mt-10 text-center text-xs text-neutral-dark">
            <p>© 2025 综合库开发</p>
           <p>© 2025 辅料取样计算器 | 版本 1.0.0</p>
        </footer>
    </div>

    <!-- 复制成功提示 -->
    <div id="copyToast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg text-sm hidden">
        <i class="fa fa-check mr-1"></i>已复制到剪贴板
    </div>

    <script>
        // 初始化变量
        const inputValue = document.getElementById('inputValue');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultSection = document.getElementById('resultSection');
        const resultValue = document.getElementById('resultValue');
        const resultFormula = document.getElementById('resultFormula');
        const resultExplanation = document.getElementById('resultExplanation');
        const copyBtn = document.getElementById('copyBtn');
        const copyToast = document.getElementById('copyToast');
        const historyList = document.getElementById('historyList');
        const emptyHistory = document.getElementById('emptyHistory');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        
        // 从本地存储加载历史记录
        let history = JSON.parse(localStorage.getItem('samplingHistory')) || [];
        
        // 页面加载时显示历史记录
        window.addEventListener('DOMContentLoaded', () => {
            displayHistory();
            
            // 自动聚焦到输入框
            inputValue.focus();
            
            // 检查URL参数中是否有预设值
            const urlParams = new URLSearchParams(window.location.search);
            const presetValue = urlParams.get('value');
            if (presetValue) {
                inputValue.value = presetValue;
                calculateSampling();
            }
        });
        
        // 计算按钮点击事件
        calculateBtn.addEventListener('click', calculateSampling);
        
        // 输入框回车事件
        inputValue.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                calculateSampling();
            }
        });
        
        // 复制结果按钮点击事件
        copyBtn.addEventListener('click', () => {
            const textToCopy = `${resultValue.textContent} (${resultFormula.textContent})`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showCopyToast();
            });
        });
        
        // 清除历史记录按钮点击事件
        clearHistoryBtn.addEventListener('click', () => {
            if (history.length > 0) {
                if (confirm('确定要清除所有历史记录吗？')) {
                    history = [];
                    localStorage.setItem('samplingHistory', JSON.stringify(history));
                    displayHistory();
                }
            }
        });
        
        // 计算取样数量函数
        function calculateSampling() {
            const n = parseFloat(inputValue.value);
            
            // 验证输入
            if (isNaN(n) || n <= 0) {
                showError('请输入有效的正数');
                return;
            }
            
            let samplingCount, formula, explanation;
            
            // 根据规则计算取样数量
            if (n <= 3) {
                samplingCount = n;
                formula = 'n';
                explanation = `因为 n = ${n} ≤ 3，所以按照规则1，应逐件抽检 ${samplingCount} 件`;
            } else if (n <= 300) {
                samplingCount = Math.ceil(Math.sqrt(n) + 1);
                formula = '√n + 1';
                explanation = `因为 3 < n = ${n} ≤ 300，所以按照规则2，计算 √${n} + 1 ≈ ${(Math.sqrt(n) + 1).toFixed(2)}，进位后应抽检 ${samplingCount} 件`;
            } else {
                // 修正规则3：先算根号n，再除以2，最后加1
                const sqrtN = Math.sqrt(n);
                samplingCount = Math.ceil((sqrtN / 2) + 1);
                formula = '(√n)/2 + 1';
                explanation = `因为 n = ${n} > 300，所以按照规则3，计算 (√${n})/2 + 1 ≈ ${((sqrtN / 2) + 1).toFixed(2)}，进位后应抽检 ${samplingCount} 件`;
            }
            
            // 显示结果
            resultValue.textContent = samplingCount;
            resultFormula.textContent = formula;
            resultExplanation.textContent = explanation;
            resultSection.classList.remove('hidden');
            
            // 保存到历史记录
            const historyItem = {
                input: n,
                result: samplingCount,
                formula: formula,
                timestamp: new Date().toISOString()
            };
            
            history.unshift(historyItem);
            
            // 限制历史记录数量
            if (history.length > 10) {
                history.pop();
            }
            
            // 保存到本地存储
            localStorage.setItem('samplingHistory', JSON.stringify(history));
            
            // 更新历史记录显示
            displayHistory();
            
            // 滚动到结果区域
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // 显示历史记录函数
        function displayHistory() {
            // 清空历史记录列表
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                // 显示空历史提示
                historyList.appendChild(emptyHistory);
                return;
            }
            
            // 添加历史记录项
            history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item p-4 border-b last:border-b-0 flex items-center justify-between';
                
                // 格式化时间
                const date = new Date(item.timestamp);
                const timeString = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                historyItem.innerHTML = `
                    <div>
                        <div class="flex items-center">
                            <span class="text-sm font-medium text-gray-800">输入: ${item.input}</span>
                            <span class="mx-2 text-gray-300">→</span>
                            <span class="text-sm font-bold text-primary">结果: ${item.result}</span>
                        </div>
                        <div class="text-xs text-gray-500 mt-1">
                            公式: ${item.formula} | ${timeString}
                        </div>
                    </div>
                    <button class="text-neutral-dark hover:text-primary transition-colors reuse-btn" data-index="${index}">
                        <i class="fa fa-refresh"></i>
                    </button>
                `;
                
                historyList.appendChild(historyItem);
                
                // 添加重用按钮事件
                const reuseBtn = historyItem.querySelector('.reuse-btn');
                reuseBtn.addEventListener('click', () => {
                    inputValue.value = item.input;
                    calculateSampling();
                    inputValue.focus();
                });
            });
        }
        
        // 显示复制成功提示
        function showCopyToast() {
            copyToast.classList.remove('hidden');
            setTimeout(() => {
                copyToast.classList.add('hidden');
            }, 2000);
        }
        
        // 显示错误提示
        function showError(message) {
            alert(message);
            inputValue.focus();
        }
    </script>
</body>
</html>
