<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽检数量计算器</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#60a5fa',
                        accent: '#1e40af',
                        neutral: '#f3f4f6',
                        'neutral-dark': '#9ca3af'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.05)',
                        'hover': '0 8px 30px rgba(0, 0, 0, 0.12)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-effect {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
            }
            .input-focus {
                @apply focus:ring-2 focus:ring-primary focus:ring-opacity-50 focus:outline-none;
            }
            .btn-primary {
                @apply bg-primary hover:bg-accent text-white font-medium py-3 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 shadow-soft hover:shadow-hover;
            }
            .card {
                @apply bg-white rounded-xl shadow-soft p-6 transition-all duration-300;
            }
            .card-hover {
                @apply hover:shadow-hover;
            }
            .result-highlight {
                @apply text-accent font-bold text-3xl md:text-4xl;
            }
            .rule-text {
                @apply text-gray-700 font-medium;
            }
            .rule-highlight {
                @apply text-primary font-bold;
            }
            .history-item {
                @apply border-b border-gray-200 py-3 last:border-b-0;
            }
            .history-time {
                @apply text-xs text-gray-500;
            }
            .history-value {
                @apply font-medium text-gray-800;
            }
            .history-result {
                @apply font-bold text-accent;
            }
            .animate-fade-in {
                animation: fadeIn 0.3s ease-in-out;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-slide-down {
                animation: slideDown 0.3s ease-in-out;
            }
            @keyframes slideDown {
                from { opacity: 0; max-height: 0; }
                to { opacity: 1; max-height: 500px; }
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <!-- 标题区域 -->
        <header class="text-center mb-8">
            <h1 class="text-[clamp(1.8rem,5vw,2.5rem)] font-bold text-gray-800 mb-2">抽检数量计算器</h1>
            <p class="text-gray-600 text-[clamp(0.9rem,3vw,1rem)]">快速计算收料抽检数量</p>
        </header>

        <!-- 主内容区域 -->
        <main>
            <!-- 输入卡片 -->
            <div class="card card-hover mb-8">
                <div class="mb-6">
                    <label for="packageCount" class="block text-gray-700 font-medium mb-2">收料总包件数 (n)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
                            <i class="fa fa-cubes"></i>
                        </span>
                        <input 
                            type="number" 
                            id="packageCount" 
                            class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 input-focus"
                            placeholder="请输入收料总包件数" 
                            min="1"
                            inputmode="numeric"
                            pattern="[0-9]*"
                        >
                    </div>
                </div>
                
                <button id="calculateBtn" class="btn-primary w-full flex items-center justify-center">
                    <i class="fa fa-calculator mr-2"></i>
                    计算抽检数量
                </button>
            </div>

            <!-- 结果卡片 -->
            <div id="resultCard" class="card card-hover mb-8 hidden">
                <h2 class="text-xl font-bold text-gray-800 mb-4">计算结果</h2>
                
                <div class="bg-blue-50 rounded-lg p-4 mb-4">
                    <p class="text-gray-700 mb-2">需称重数量：</p>
                    <p id="resultValue" class="result-highlight">0</p>
                </div>
                
                <div class="bg-gray-50 rounded-lg p-4">
                    <p class="text-gray-700 mb-2">适用规则：</p>
                    <p id="appliedRule" class="rule-text"></p>
                </div>
            </div>

            <!-- 历史记录卡片 -->
            <div class="card card-hover mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">操作记录</h2>
                    <button id="toggleHistoryBtn" class="text-primary hover:text-accent focus:outline-none">
                        <i class="fa fa-chevron-down"></i>
                    </button>
                </div>
                <div id="historyContainer" class="hidden animate-slide-down overflow-hidden">
                    <div id="historyList" class="max-h-64 overflow-y-auto pr-2">
                        <!-- 历史记录将在这里动态添加 -->
                        <p class="text-gray-500 text-center py-4" id="emptyHistoryMsg">暂无操作记录</p>
                    </div>
                    <div class="mt-4 flex justify-between">
                        <button id="clearHistoryBtn" class="text-sm text-red-500 hover:text-red-700 focus:outline-none">
                            <i class="fa fa-trash-o mr-1"></i> 清空记录
                        </button>
                        <span id="historyCount" class="text-sm text-gray-500">共 0 条记录</span>
                    </div>
                </div>
            </div>

            <!-- 规则说明卡片 -->
            <div class="card card-hover">
                <h2 class="text-xl font-bold text-gray-800 mb-4">抽检规则说明</h2>
                
                <ul class="space-y-3">
                    <li class="flex items-start">
                        <span class="rule-highlight mr-2">1.</span>
                        <span class="rule-text">当 n ≤ 3 时，逐件抽检</span>
                    </li>
                    <li class="flex items-start">
                        <span class="rule-highlight mr-2">2.</span>
                        <span class="rule-text">当 3 &lt; n ≤ 300 时，按 √n+1 抽检</span>
                    </li>
                    <li class="flex items-start">
                        <span class="rule-highlight mr-2">3.</span>
                        <span class="rule-text">当 n &gt; 300 时，按 √n/2+1 抽检</span>
                    </li>
                </ul>
                
                <p class="mt-4 text-gray-600 text-sm">注：若 n 非整数，则进位成整数</p>
            </div>
        </main>

        <!-- 页脚 -->
        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>© 2025 抽检数量计算器 | 为仓库管理人员设计</p>
        </footer>
    </div>

    <script>
        // 获取DOM元素
        const packageCountInput = document.getElementById('packageCount');
        const calculateBtn = document.getElementById('calculateBtn');
        const resultCard = document.getElementById('resultCard');
        const resultValue = document.getElementById('resultValue');
        const appliedRule = document.getElementById('appliedRule');
        const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
        const historyContainer = document.getElementById('historyContainer');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');
        const historyCount = document.getElementById('historyCount');
        const emptyHistoryMsg = document.getElementById('emptyHistoryMsg');
        
        // 历史记录管理
        let history = JSON.parse(localStorage.getItem('inspectionHistory')) || [];
        const MAX_HISTORY_ITEMS = 10; // 最大保存记录数，减少为10条
        
        // 初始化历史记录
        updateHistoryUI();
        updateHistoryCount();

        // 计算函数
        function calculateInspectionCount(n) {
            // 如果输入不是数字或为空，返回0
            if (isNaN(n) || n === '') return 0;
            
            // 确保n为数字并向上取整
            n = Math.ceil(Number(n));
            
            let count = 0;
            let rule = '';
            
            // 根据规则计算抽检数量
            if (n <= 3) {
                count = n;
                rule = '当 n ≤ 3 时，逐件抽检';
            } else if (n <= 300) {
                const sqrtN = Math.sqrt(n);
                count = Math.ceil(sqrtN) + 1;
                rule = `当 3 &lt; n ≤ 300 时，按 √n+1 抽检 (√${n}+1≈${sqrtN.toFixed(2)}+1≈${count})`;
            } else {
                const sqrtN = Math.sqrt(n);
                count = Math.ceil(sqrtN / 2) + 1;
                rule = `当 n &gt; 300 时，按 √n/2+1 抽检 (√${n}/2+1≈${sqrtN.toFixed(2)}/2+1≈${count})`;
            }
            
            return { count, rule };
        }

        // 更新结果显示
        function updateResult() {
            const n = packageCountInput.value;
            
            if (n === '' || isNaN(n) || Number(n) < 1) {
                resultCard.classList.add('hidden');
                return;
            }
            
            const { count, rule } = calculateInspectionCount(n);
            
            resultValue.textContent = count;
            appliedRule.innerHTML = rule;
            resultCard.classList.remove('hidden');
            
            // 添加显示动画
            resultCard.classList.add('animate-fade-in');
        }
        
        // 计算并保存历史记录
        function calculateAndSave() {
            updateResult();
            
            const n = packageCountInput.value;
            if (n === '' || isNaN(n) || Number(n) < 1) return;
            
            const { count, rule } = calculateInspectionCount(n);
            saveToHistory(n, count, rule);
        }
        
        // 保存到历史记录
        function saveToHistory(inputValue, result, rule) {
            const timestamp = new Date();
            const historyItem = {
                id: Date.now(),
                input: Math.ceil(Number(inputValue)),
                result: result,
                rule: rule.replace(/<[^>]*>/g, ''), // 移除HTML标签
                timestamp: timestamp.toISOString()
            };
            
            // 添加到历史记录数组开头
            history.unshift(historyItem);
            
            // 限制历史记录数量
            if (history.length > MAX_HISTORY_ITEMS) {
                history = history.slice(0, MAX_HISTORY_ITEMS);
            }
            
            // 保存到本地存储
            localStorage.setItem('inspectionHistory', JSON.stringify(history));
            
            // 更新UI
            updateHistoryUI();
            updateHistoryCount();
        }
        
        // 更新历史记录UI
        function updateHistoryUI() {
            // 清空现有记录
            historyList.innerHTML = '';
            
            if (history.length === 0) {
                emptyHistoryMsg.classList.remove('hidden');
                return;
            }
            
            emptyHistoryMsg.classList.add('hidden');
            
            // 添加历史记录项
            history.forEach(item => {
                const historyItemElement = document.createElement('div');
                historyItemElement.className = 'history-item animate-fade-in';
                
                const date = new Date(item.timestamp);
                const formattedDate = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                historyItemElement.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center">
                                <span class="history-value">${item.input}</span>
                                <span class="mx-2 text-gray-400">→</span>
                                <span class="history-result">${item.result}</span>
                            </div>
                            <p class="text-xs text-gray-600 mt-1">${item.rule}</p>
                        </div>
                        <span class="history-time">${formattedDate}</span>
                    </div>
                `;
                
                historyList.appendChild(historyItemElement);
            });
        }
        
        // 更新历史记录计数
        function updateHistoryCount() {
            historyCount.textContent = `共 ${history.length} 条记录`;
        }
        
        // 切换历史记录显示/隐藏
        function toggleHistory() {
            const isHidden = historyContainer.classList.contains('hidden');
            
            if (isHidden) {
                historyContainer.classList.remove('hidden');
                toggleHistoryBtn.innerHTML = '<i class="fa fa-chevron-up"></i>';
            } else {
                historyContainer.classList.add('hidden');
                toggleHistoryBtn.innerHTML = '<i class="fa fa-chevron-down"></i>';
            }
        }
        
        // 清空历史记录
        function clearHistory() {
            if (history.length === 0) return;
            
            if (confirm('确定要清空所有操作记录吗？')) {
                history = [];
                localStorage.removeItem('inspectionHistory');
                updateHistoryUI();
                updateHistoryCount();
            }
        }

        // 点击计算按钮事件
        calculateBtn.addEventListener('click', function() {
            // 添加按钮点击效果
            this.classList.add('scale-95');
            setTimeout(() => {
                this.classList.remove('scale-95');
            }, 150);
            
            calculateAndSave();
            
            // 滚动到结果区域
            if (!resultCard.classList.contains('hidden')) {
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });

        // 输入框实时计算事件（不保存历史记录）
        packageCountInput.addEventListener('input', updateResult);
        
        // 输入框回车键触发计算（保存历史记录）
        packageCountInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateAndSave();
                
                // 滚动到结果区域
                if (!resultCard.classList.contains('hidden')) {
                    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            }
        });
        
        // 历史记录相关事件监听
        toggleHistoryBtn.addEventListener('click', toggleHistory);
        clearHistoryBtn.addEventListener('click', clearHistory);
    </script>
</body>
</html>
